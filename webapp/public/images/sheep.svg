<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect width="200" height="200" fill="#1A1500"/>

  <!-- Ground -->
  <rect x="0" y="148" width="200" height="52" fill="#1F1A00" rx="0"/>
  <ellipse cx="100" cy="148" rx="100" ry="6" fill="#252000"/>

  <!-- Wool body (fluffy cloud shape) -->
  <circle cx="85"  cy="105" r="28" fill="#C8A840" opacity="0.95"/>
  <circle cx="110" cy="98"  r="26" fill="#C8A840" opacity="0.95"/>
  <circle cx="100" cy="88"  r="24" fill="#D4B448" opacity="0.95"/>
  <circle cx="75"  cy="98"  r="22" fill="#C8A840" opacity="0.95"/>
  <circle cx="122" cy="108" r="22" fill="#C0A038" opacity="0.95"/>
  <circle cx="68"  cy="110" r="20" fill="#C0A038" opacity="0.95"/>
  <circle cx="95"  cy="115" r="20" fill="#C8A840" opacity="0.95"/>

  <!-- Wool texture dots -->
  <circle cx="88"  cy="95"  r="4" fill="#B89030" opacity="0.5"/>
  <circle cx="105" cy="88"  r="4" fill="#B89030" opacity="0.5"/>
  <circle cx="80"  cy="108" r="3" fill="#B89030" opacity="0.5"/>
  <circle cx="115" cy="102" r="3" fill="#B89030" opacity="0.5"/>
  <circle cx="97"  cy="102" r="5" fill="#D4B448" opacity="0.4"/>

  <!-- Head -->
  <ellipse cx="130" cy="118" rx="18" ry="15" fill="#A07820"/>
  <!-- Ear -->
  <ellipse cx="143" cy="112" rx="7" ry="5" fill="#8A6518" transform="rotate(-20 143 112)"/>
  <!-- Eye -->
  <circle cx="135" cy="116" r="4" fill="#1A1500"/>
  <circle cx="136" cy="115" r="1.5" fill="#E8C97A" opacity="0.7"/>
  <!-- Nostril -->
  <ellipse cx="132" cy="124" rx="3" ry="2" fill="#8A6518"/>

  <!-- Legs -->
  <rect x="73"  y="138" width="9" height="18" rx="4" fill="#A07820"/>
  <rect x="87"  y="140" width="9" height="16" rx="4" fill="#A07820"/>
  <rect x="101" y="140" width="9" height="16" rx="4" fill="#A07820"/>
  <rect x="115" y="138" width="9" height="18" rx="4" fill="#A07820"/>

  <!-- Hooves -->
  <rect x="73"  y="153" width="9" height="5" rx="2" fill="#5A3A00"/>
  <rect x="87"  y="153" width="9" height="5" rx="2" fill="#5A3A00"/>
  <rect x="101" y="153" width="9" height="5" rx="2" fill="#5A3A00"/>
  <rect x="115" y="153" width="9" height="5" rx="2" fill="#5A3A00"/>

  <!-- Cloth/textile label -->
  <text x="100" y="175" text-anchor="middle" font-family="monospace" font-size="11"
        font-weight="bold" fill="#E8C97A" opacity="0.85" letter-spacing="2">ТКАНЬ</text>

  <!-- Glow border -->
  <rect width="200" height="200" fill="none" stroke="#E8C97A" stroke-width="3" opacity="0.35"/>
</svg>
